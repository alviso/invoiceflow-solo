<!doctype html>
<html lang="en">
<!-- =====================================================================
     blindrange app loader — the only static file any app ever needs.

     Usage:  loader.html#<sha256-of-app>

     Fetches the app's chunks from the public blindrange network (they
     are stored AS DATABASE ENTRIES, keyed by content hash), verifies
     the hash IN THIS BROWSER, and only then renders. Nobody can swap
     the app under you: the address IS the integrity check — the
     defense dapp frontends never had. A new version is a new hash; an
     old link keeps loading exactly the bytes it always did, forever,
     from cache after the first visit.

     Trust root = this file + the blindrange.js it imports for ring
     placement. Both are small and boring on purpose; read them.
     ===================================================================== -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loading…</title>
<style>
  body { background:#0f1115; color:#8b93a1; display:grid;
         place-items:center; height:100vh; margin:0;
         font:14px/1.6 ui-monospace, Menlo, monospace; }
  b { color:#5cc8ff; font-weight:normal; }
</style>
</head>
<body>
<div id="s">resolving application…</div>
<script type="module">
import { Ring, failureGroup }
  from "https://blindrange.dev/blindrange.js?v=2";

const GATEWAY = "https://blindrange.dev/api";
const SEED = "seed.blindrange.dev:7501";
const SECRET = "blindrange-public";
const S = document.getElementById("s");
const te = new TextEncoder();
const hex = (b) => [...new Uint8Array(b)]
  .map((x) => x.toString(16).padStart(2, "0")).join("");
const hexhash = async (buf) =>
  hex(await crypto.subtle.digest("SHA-256", buf));
const sign = async (body) => {
  const k = await crypto.subtle.importKey("raw", te.encode(SECRET),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return hex(await crypto.subtle.sign("HMAC", k, body));
};
async function fwd(addr, method, path, payload) {
  const env = te.encode(JSON.stringify({ addr, method, path,
    body_b64: payload ? btoa(JSON.stringify(payload)) : "" }));
  const r = await fetch(GATEWAY + "/fwd", { method: "POST",
    headers: { "Content-Type": "application/json",
               "X-BR-Auth": await sign(env) }, body: env });
  const out = await r.json();
  if (out.status >= 400) throw new Error(`${addr} -> ${out.status}`);
  return JSON.parse(atob(out.body_b64 || ""));
}

let ring = null, addrOf = {};
async function buildRing() {
  const peers = (await fwd(SEED, "GET", "/peers", null)).peers;
  const groups = {};
  for (const [nid, e] of Object.entries(peers))
    if ((e.age ?? 1e9) <= 40 && e.addr && !e.addr.startsWith("via:")) {
      addrOf[nid] = e.addr;
      groups[nid] = failureGroup(e.addr, e.udp || "");
    }
  ring = await Ring.build(Object.keys(addrOf).sort(), { groups });
}
async function blobGet(key) {
  for (const nid of await ring.route(key, Math.min(6, ring.addrs.length))) {
    try {
      const r = await fwd(addrOf[nid], "POST", "/mget", { keys: [key],
        nonce: hex(crypto.getRandomValues(new Uint8Array(16))) });
      if (r.values && r.values[key]) return r.values[key];
    } catch { continue; }
  }
  return null;
}

const hash = location.hash.slice(1);
if (!/^[0-9a-f]{64}$/.test(hash)) {
  S.innerHTML = "no app hash in the URL — expected <b>loader.html#&lt;sha256&gt;</b>";
} else {
  try {
    // immutable ⇒ cache forever, verified once per device
    let html = localStorage.getItem("app:" + hash);
    if (!html) {
      S.innerHTML = "reading the network roster…";
      await buildRing();
      S.innerHTML = "fetching manifest <b>" + hash.slice(0, 12) + "…</b>";
      const man = await blobGet("B:" + hash);
      if (!man) throw new Error("app not found on the network");
      const { chunks } = JSON.parse(atob(man));
      const parts = [];
      for (let i = 0; i < chunks.length; i++) {
        S.innerHTML = `chunk ${i + 1}/${chunks.length} from blind storage…`;
        const b64c = await blobGet("B:" + chunks[i]);
        if (!b64c) throw new Error("chunk missing: " + chunks[i].slice(0, 12));
        const bytes = Uint8Array.from(atob(b64c), (ch) => ch.charCodeAt(0));
        if (await hexhash(bytes) !== chunks[i])
          throw new Error("chunk failed verification — refusing to run");
        parts.push(bytes);
      }
      const whole = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
      let off = 0;
      for (const p of parts) { whole.set(p, off); off += p.length; }
      if (await hexhash(whole) !== hash)
        throw new Error("application failed verification — refusing to run");
      html = new TextDecoder().decode(whole);
      try { localStorage.setItem("app:" + hash, html); } catch {}
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    S.innerHTML = "refused: " + e.message;
  }
}
</script>
</body>
</html>
