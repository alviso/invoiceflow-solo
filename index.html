<!doctype html>
<html lang="en">
<!-- =====================================================================
     InvoiceFlow Solo — invoicing with no backend and no landlord.

     This file is the entire application. The database lives on the
     public blindrange network as ciphertext under pseudorandom keys;
     the keys that read it live in THIS browser, sealed under your
     passphrase. Nobody hosts your ledger. Nobody can read it. Nobody
     can lock you out of it.

     Third rebuild of the same product, one variable moved each time:
       v1  React + FastAPI + MongoDB      (classic SaaS)
       v2  React + FastAPI + blindrange   (blind storage, own server)
       v3  this file                      (no server at all)

     No build step, no framework, no third-party scripts — a page that
     holds master keys must not run anyone else's code. blindrange.js
     is vendored next to this file for the same reason.
     ===================================================================== -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceFlow Solo</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --txt:#1c2430;
          --dim:#68727f; --acc:#2563eb; --ok:#15803d; --warn:#b45309;
          --bad:#b91c1c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt);
         font:15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--acc); text-decoration:none; cursor:pointer; }
  .shell { max-width:980px; margin:0 auto; padding:0 20px 60px; }
  header { display:flex; align-items:center; gap:22px; padding:16px 0;
           border-bottom:1px solid var(--line); margin-bottom:22px;
           flex-wrap:wrap; }
  header h1 { font-size:19px; letter-spacing:-.3px; }
  header h1 b { color:var(--acc); font-weight:800; }
  nav { display:flex; gap:14px; flex-wrap:wrap; }
  nav a { color:var(--dim); font-size:14px; padding:4px 2px; }
  nav a.on { color:var(--acc); border-bottom:2px solid var(--acc); }
  .push { margin-left:auto; font-size:12.5px; color:var(--dim); }
  h2 { font-size:20px; margin:4px 0 16px; letter-spacing:-.2px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:20px 22px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--dim); margin:10px 0 4px;
          text-transform:uppercase; letter-spacing:.05em; }
  input, select, textarea { width:100%; font:inherit; color:var(--txt);
          background:#fff; border:1px solid var(--line); border-radius:8px;
          padding:8px 11px; }
  input:focus, select:focus, textarea:focus { outline:2px solid #bfd3fa;
          border-color:var(--acc); }
  button { font:inherit; border-radius:8px; padding:9px 16px; cursor:pointer;
           border:1px solid var(--acc); background:var(--acc); color:#fff; }
  button.ghost { background:#fff; color:var(--acc); }
  button.quiet { background:#fff; color:var(--dim); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--dim); font-size:12px;
       text-transform:uppercase; letter-spacing:.05em; font-weight:600;
       padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:10px; border-bottom:1px solid var(--line); }
  tr.click { cursor:pointer; } tr.click:hover td { background:#f3f6fc; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .grid3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:0 18px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .right { text-align:right; }
  .pill { font-size:11.5px; padding:3px 10px; border-radius:99px;
          border:1px solid; font-weight:600; }
  .pill.created { color:var(--dim); border-color:var(--line); }
  .pill.sent { color:var(--warn); border-color:var(--warn); }
  .pill.paid { color:var(--ok); border-color:var(--ok); }
  .pill.cancelled { color:var(--bad); border-color:var(--bad);
                    text-decoration:line-through; }
  .stat { display:inline-block; margin-right:34px; }
  .stat b { display:block; font-size:26px; letter-spacing:-.5px; }
  .stat span { font-size:12px; color:var(--dim); text-transform:uppercase; }
  .muted { color:var(--dim); font-size:13px; }
  .spin { display:inline-block; width:14px; height:14px; border-radius:50%;
          border:2px solid var(--line); border-top-color:var(--acc);
          animation:sp 0.8s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
           background:#1c2430; color:#fff; padding:10px 18px; font-size:14px;
           border-radius:9px; opacity:0; transition:opacity .25s;
           pointer-events:none; max-width:90vw; }
  #toast.show { opacity:1; }
  .lines th, .lines td { padding:6px; }
  .lines input { padding:6px 8px; }
  textarea.invite { font:11px ui-monospace, Menlo, monospace; min-height:70px; }

  /* ------------------------------ unlock gate ----------------------- */
  .gate { position:fixed; inset:0; display:grid;
          grid-template-columns:minmax(420px, 44%) 1fr; background:#fff;
          z-index:5; overflow:auto; }
  .gate-left { display:flex; flex-direction:column; justify-content:center;
               padding:48px 56px; max-width:560px; margin:0 auto; width:100%; }
  .gate-brand { font-size:26px; font-weight:800; letter-spacing:-.5px;
                margin-bottom:4px; }
  .gate-brand b { color:var(--acc); }
  .gate-sub { color:var(--dim); margin-bottom:28px; }
  .gate-card { border:1px solid var(--line); border-radius:14px;
               padding:22px 24px; box-shadow:0 8px 28px rgba(16,42,90,.06);
               margin-bottom:22px; }
  .gate-card h3 { font-size:19px; margin-bottom:4px; }
  .gate-feats { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;
                margin:4px 0 22px; }
  .gate-feats b { display:block; font-size:13.5px; }
  .gate-feats span { font-size:12.5px; color:var(--dim); }
  .gate-honest { background:#f2f5f9; border:1px solid var(--line);
                 border-radius:10px; padding:13px 15px; font-size:12.5px;
                 color:var(--dim); }
  .gate-honest b { color:var(--txt); }
  .gate-hero { position:relative; overflow:hidden;
    background:
      conic-gradient(from 220deg at 78% 12%, rgba(255,255,255,.16) 0 14%, transparent 0),
      conic-gradient(from 40deg at 18% 34%, rgba(255,255,255,.10) 0 18%, transparent 0),
      conic-gradient(from 130deg at 62% 58%, rgba(13,52,120,.35) 0 22%, transparent 0),
      conic-gradient(from 320deg at 35% 82%, rgba(255,255,255,.12) 0 16%, transparent 0),
      conic-gradient(from 80deg at 88% 74%, rgba(10,40,100,.4) 0 20%, transparent 0),
      linear-gradient(155deg, #1e50b5 0%, #2f6fe0 45%, #79aef2 100%); }
  .gate-hero-inner { position:absolute; left:56px; right:56px; bottom:52px;
                     color:#fff; }
  .gate-hero h1 { font-size:34px; line-height:1.2; letter-spacing:-.5px;
                  margin-bottom:10px; font-weight:800; }
  .gate-hero p { color:rgba(255,255,255,.85); font-size:16px; max-width:560px; }
  @media (max-width:900px) { .gate { grid-template-columns:1fr; }
    .gate-hero { display:none; } }

  /* --------- the printable invoice: this IS the PDF feature ---------- */
  #print-root { display:none; }
  @media print {
    body * { visibility:hidden; }
    #print-root, #print-root * { visibility:visible; }
    #print-root { display:block; position:absolute; inset:0;
                  background:#fff; color:#000; padding:14mm;
                  font:12.5px/1.5 -apple-system, "Segoe UI", sans-serif; }
    .p-head { display:flex; justify-content:space-between;
              align-items:flex-start; margin-bottom:26px; }
    .p-head img { max-height:58px; max-width:200px; }
    .p-num { font-size:24px; font-weight:800; }
    .p-cols { display:flex; justify-content:space-between; margin:18px 0; }
    .p-cols h4 { font-size:11px; text-transform:uppercase; color:#555;
                 margin-bottom:4px; }
    #print-root table { width:100%; border-collapse:collapse; margin:14px 0; }
    #print-root th { border-bottom:1.5px solid #000; color:#000;
                     font-size:11px; padding:6px 4px; }
    #print-root td { border-bottom:.5px solid #bbb; padding:7px 4px; }
    .p-totals { margin-left:auto; width:260px; }
    .p-totals td { border:none; padding:3px 4px; }
    .p-grand { font-size:16px; font-weight:800; border-top:1.5px solid #000; }
    .p-foot { margin-top:30px; font-size:11.5px; color:#444;
              white-space:pre-wrap; }
  }
</style>
</head>
<body>
<div class="shell">
  <header id="chrome" style="display:none">
    <h1>Invoice<b>Flow</b> <span class="muted">Solo</span></h1>
    <nav id="nav">
      <a data-page="dash">Dashboard</a>
      <a data-page="invoices">Invoices</a>
      <a data-page="new">New invoice</a>
      <a data-page="customers">Customers</a>
      <a data-page="items">Items</a>
      <a data-page="settings">Settings</a>
    </nav>
    <span class="push" id="netinfo"></span>
  </header>
  <main id="view"></main>
</div>
<div id="toast"></div>
<div id="print-root"></div>

<script type="module">
import { Owner, idbAdapter, memoryAdapter } from "./blindrange.js";

/* ------------------------------------------------------------------ *
 * One database, one schema, a `kind` discriminator — five entity
 * types share one dyadic index. Only these four fields are ever
 * range-indexed; everything else (addresses, line items, the logo,
 * totals) travels sealed inside records the network cannot read.
 *   kind: 1 profile · 2 customer · 3 item · 4 invoice · 5 condition
 *   num:  invoice number (10001+)
 *   day:  issue date, days since 2020-01-01 (leaf 8 = the network can
 *         never resolve WHEN finer than an 8-day band)
 *   name: customer/item name, first 6 chars prefix-searchable
 * ------------------------------------------------------------------ */
const SCHEMA = {
  kind: { type: "int", bits: 3,  leaf_width: 1 },
  num:  { type: "int", bits: 20, leaf_width: 16 },
  day:  { type: "int", bits: 15, leaf_width: 8 },
  name: { type: "str", bits: 30, leaf_width: 16, chars: 6 },
};
const K = { profile: 1, customer: 2, item: 3, invoice: 4, condition: 5 };
const NET = {
  bootstrap: ["seed.blindrange.dev:7501"],
  networkSecret: "blindrange-public",       // public DEMO network — run
  gateway: ["https://blindrange.dev/api"],  // your own nodes for real books
};
const EPOCH_DAY = Date.UTC(2020, 0, 1);
const toDay = (iso) => Math.max(0, Math.round(
  (Date.parse(iso + "T00:00:00Z") - EPOCH_DAY) / 86400000));
const NUM_MAX = 2 ** 20 - 1, DAY_MAX = 2 ** 15 - 1;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
            "'": "&#39;" }[c]));
const money = (n, cur) => new Intl.NumberFormat(undefined,
  { style: "currency", currency: cur || "USD" }).format(n || 0);
let mlock = false;
// Every mutation handler goes through here: the button disables, and a
// second click while the first write is in flight does NOTHING. Seven
// cancelled copies of invoice #10001 exist because this did not.
const guard = (fn) => async (ev) => {
  if (mlock) return;
  mlock = true;
  const b = ev && ev.target && ev.target.tagName === "BUTTON"
    ? ev.target : null;
  if (b) b.disabled = true;
  try { await fn(ev); }
  catch (e) { console.error(e); toast("refused: " + e.message); }
  finally { mlock = false; if (b) b.disabled = false; }
};

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

let toastT;
function toast(msg) {
  $("#toast").textContent = msg;
  $("#toast").classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => $("#toast").classList.remove("show"), 3200);
}

let db = null;
let profile = null;          // the kind=1 singleton, cached
let draftFrom = null;        // invoice being duplicated into the form
let editFrom = null;         // invoice being edited (same number, new rev)

/* ------------------------------- data -------------------------------- */
// Identity + a merge rule instead of uniqueness constraints. Every
// record carries a stable logical id (lid, minted at create, preserved
// through updates) and a monotonic rev. Readers keep the highest rev
// per lid and lazily tombstone shadowed copies; records written before
// this pattern keep their own identity and never collapse.
const newLid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)))
  .map((b) => b.toString(16).padStart(2, "0")).join("");

function dedupe(rows) {
  const by = new Map();
  const losers = [];
  for (const r of rows) {
    const k = r.lid || "_" + r._rid;
    const cur = by.get(k);
    if (!cur) { by.set(k, r); continue; }
    const win = (r.rev || 0) > (cur.rev || 0) ||
      ((r.rev || 0) === (cur.rev || 0) && r._rid > cur._rid);
    if (win) { losers.push(cur); by.set(k, r); }
    else losers.push(r);
  }
  if (losers.length)
    db.deleteMany(losers.map((l) => l._rid)).catch(() => {});
  return [...by.values()];
}
const listKind = async (k) => dedupe(await db.query("kind", k, k));

async function loadProfile() {
  const rows = await listKind(K.profile);
  profile = rows.sort((a, b) => (b.saved_at || 0) - (a.saved_at || 0))[0]
    || null;
  return profile;
}
// create (prev = null) and update through one door: the lid survives
// the update, rev increments, and the old version is tombstoned after
// the new one is durable — duplicate on crash, hole never.
async function replace(rec, prev) {
  rec.lid = (prev && prev.lid) || rec.lid || newLid();
  rec.rev = ((prev && prev.rev) || 0) + 1;
  await db.insert(rec);
  if (prev && prev._rid) await db.delete(prev._rid);
}

/* ------------------------------ unlock ------------------------------- */
function unlockView(msg = "") {
  $("#chrome").style.display = "none";
  $("#view").innerHTML = `
  <div class="gate">
    <div><div class="gate-left">
      <div class="gate-brand">Invoice<b>Flow</b> <span class="muted"
        style="font-size:15px">Solo</span></div>
      <div class="gate-sub">Professional invoicing — on nobody's server.</div>
      <div class="gate-card">
        <h3>Your books, your keys</h3>
        <p class="muted" style="margin-bottom:6px">The passphrase unlocks
        this browser's copy of the master key. First time here? The same
        passphrase creates a new ledger.</p>
        <label>Passphrase</label>
        <input id="pass" type="password" autocomplete="current-password">
        <label>Invite (only when joining an existing ledger)</label>
        <textarea id="inv" class="invite"
          placeholder="leave empty to create or reopen this device's ledger"></textarea>
        <p style="margin-top:14px"><button id="go">Unlock</button>
        <span class="muted" id="umsg">${esc(msg)}</span></p>
      </div>
      <div class="gate-feats">
        <div><b>PDF invoices</b><span>print-perfect, zero libraries</span></div>
        <div><b>Auto-save</b><span>customers, items &amp; drafts</span></div>
        <div><b>Blind storage</b><span>nobody who stores it can read it</span></div>
        <div><b>Recovery kit</b><span>your laptop is not a point of failure</span></div>
      </div>
      <div class="gate-honest"><b>Where your invoices live.</b> There is
      no server: this page derives the keys, seals every record, and
      talks to the public <a href="https://blindrange.dev">blindrange</a>
      network directly. The network can observe write timing, sizes and
      coarse hashed buckets — never an amount, a name, or a date. We
      publish what leaks instead of calling it "zero knowledge".</div>
    </div></div>
    <div class="gate-hero"><div class="gate-hero-inner">
      <h1>Create professional invoices.<br>Own every byte.</h1>
      <p>No account. No backend. Your books live encrypted on a network
      of machines that cannot read them — and this application is
      delivered from the same network, verified by hash in your
      browser.</p>
    </div></div>
  </div>`;
  $("#go").onclick = async () => {
    const pass = $("#pass").value;
    if (!pass) return toast("a passphrase is required");
    $("#go").disabled = true;
    $("#umsg").innerHTML = '<span class="spin"></span> talking to the network…';
    const adapter = idbAdapter("invoiceflow-solo");
    try {
      const inv = $("#inv").value.trim();
      const hasState = (await adapter.load()) !== null;
      let sessionOnly = false;
      if (inv && hasState) {
        // This device already has its own ledger: an invite opens the
        // OTHER ledger as a session-only view — memory state, memory
        // mirror, nothing on this device touched. (Before this rule,
        // the invite was silently ignored and the wrong-passphrase
        // failure had an empty message: "nothing happened".)
        sessionOnly = true;
        db = await Owner.accept(memoryAdapter(), pass, inv,
          { gateway: NET.gateway });
      } else if (inv) {
        // fresh device + invite = the recovery-kit flow: join
        // permanently under a new passphrase
        db = await Owner.accept(adapter, pass, inv, { gateway: NET.gateway });
      } else {
        try {
          db = await Owner.open(adapter, pass, { gateway: NET.gateway });
        } catch (e) {
          if (String(e).includes("no state stored")) {
            db = await Owner.create(adapter, pass, SCHEMA, NET.bootstrap,
              { networkSecret: NET.networkSecret, gateway: NET.gateway });
          } else if (e && (e.name === "OperationError" || !e.message)) {
            throw new Error("wrong passphrase for this device's ledger");
          } else throw e;
        }
      }
      // Books deserve all three copies BEFORE the save returns. The
      // default (2 acks, third hedged) once left a demo ledger's every
      // record parked on relay tenants only; a fleet restart made the
      // whole ledger unreadable for minutes. Slower writes, stronger
      // custody — the right trade for a ledger.
      db.writeAcks = 3;
      const mir = await db.enableMirror(sessionOnly ? null
        : "invoiceflow-solo-mirror");
      if (!mir.completeOnce) {
        // ONE clean gate: letting the user in before the mirror is
        // complete meant reads were network-slow for a while and then
        // suddenly local-fast — varying reaction times train double
        // clicks. First unlock waits and says so; every unlock after
        // is instant because the mirror persists.
        $("#umsg").innerHTML = '<span class="spin"></span> first unlock: ' +
          'pulling your books into this browser\u2026';
        const secs = await db.sync();
        toast(`mirror complete (${Math.round(secs)}s) — every page is local from here on`);
      } else if (db._st.writers.length > 1) {
        db.sync().catch(() => {});      // refresh the multi-writer window
      }
      await loadProfile();
      $("#chrome").style.display = "flex";
      $("#netinfo").textContent =
        `${db.network().length} nodes · ${db._st.writers.length} writer(s)` +
        (sessionOnly ? " · session-only view" : "");
      go(profile ? "dash" : "settings");
      if (!profile) toast("welcome — set up your company first");
    } catch (e) {
      $("#umsg").textContent = e.message;
      $("#go").disabled = false;
    }
  };
}

/* ----------------------------- dashboard ----------------------------- */
async function dashView() {
  const inv = await listKind(K.invoice);
  const today = new Date().toISOString().slice(0, 10);
  const mo = today.slice(0, 7);
  const fallbackCur = profile?.default_currency || "USD";
  // sums NEVER add across currencies — grouped and shown per currency
  const byCur = (rows) => {
    const m = {};
    for (const r of rows) {
      const c = r.currency || fallbackCur;
      m[c] = (m[c] || 0) + (r.total || 0);
    }
    const parts = Object.entries(m).map(([c, v]) => money(v, c));
    return parts.length ? parts.join("<br>") : money(0, fallbackCur);
  };
  const live = inv.filter((i) => i.status !== "cancelled");
  const open = inv.filter((i) => i.status === "sent");
  const paid = inv.filter((i) => i.status === "paid");
  const overdue = open.filter((i) => (i.due_date || "9999") < today);
  const thisMonth = live.filter((i) =>
    (i.issue_date || "").startsWith(mo));
  const recent = [...inv].sort((a, b) =>
    (b.created_at || 0) - (a.created_at || 0)).slice(0, 5);
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 15);
    months.push([d.toISOString().slice(0, 7),
      d.toLocaleString(undefined, { month: "short" })]);
  }
  const paidByMonth = months.map(([m2]) => paid
    .filter((i) => (i.issue_date || "").startsWith(m2))
    .reduce((s2, i) => s2 + (i.total || 0), 0));
  const maxM = Math.max(...paidByMonth, 1);
  $("#view").innerHTML = `
  <h2>Dashboard</h2>
  ${profile && profile.name ? "" : `<div class="card" style="border-color:var(--warn)">
    <p><b>Finish your setup:</b> add your company details in
    <a onclick="return false" id="gosettings">Settings</a> — they appear
    on every printed invoice.</p></div>`}
  <div class="card">
    <span class="stat"><b>${thisMonth.length}</b><span>this month</span></span>
    <span class="stat"><b>${byCur(thisMonth)}</b><span>invoiced (month)</span></span>
    <span class="stat"><b>${byCur(open)}</b><span>outstanding</span></span>
    <span class="stat"><b>${byCur(paid)}</b><span>collected</span></span>
    <span class="stat"><b style="${overdue.length ? "color:var(--bad)" : ""}">${overdue.length}</b><span>overdue</span></span>
  </div>
  ${overdue.length ? `<div class="card" style="border-color:var(--bad)">
    <h2 style="font-size:16px;color:var(--bad)">Overdue</h2>
    <table>${overdue.map((r) => `
      <tr class="click" data-rid="${r._rid}">
        <td>${r.num}</td><td>${esc(r.customer_name)}</td>
        <td>due ${esc(r.due_date)}</td>
        <td class="right">${money(r.total, r.currency)}</td></tr>`).join("")}
    </table></div>` : ""}
  <div class="card">
    <h2 style="font-size:16px">Collected, last 6 months</h2>
    <div style="display:flex;gap:10px;align-items:flex-end;height:86px">
      ${months.map(([, label], i) => `
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
        <div title="${money(paidByMonth[i], fallbackCur)}"
          style="height:${Math.round(paidByMonth[i] / maxM * 62)}px;
          background:var(--acc);opacity:.7;border-radius:5px 5px 0 0;
          min-height:2px"></div>
        <div class="muted" style="font-size:11px;text-align:center;margin-top:4px">${label}</div>
      </div>`).join("")}
    </div>
  </div>
  <div class="card">
    <h2 style="font-size:16px">Recent invoices</h2>
    <table>${recent.map((r) => `
      <tr class="click" data-rid="${r._rid}">
        <td>${r.num}</td><td>${esc(r.customer_name)}</td>
        <td>${esc(r.issue_date)}</td>
        <td class="right">${money(r.total, r.currency)}</td>

async function newInvoiceView() {
  const [customers, items, conds] = await Promise.all(
    [listKind(K.customer), listKind(K.item), listKind(K.condition)]);
  const today = new Date().toISOString().slice(0, 10);
  const cur = profile?.default_currency || "USD";
  const condTexts = [...new Set([
    ...conds.sort((a, b) => (b.uses || 0) - (a.uses || 0)).map((c) => c.text),
    "Due on receipt", "Net 7", "Net 15", "Net 30", "Net 45", "Net 60"])];
  const startDraft = draftFrom;
  draftFrom = null;
  const editing = editFrom;
  editFrom = null;
  $("#view").innerHTML = `
  <h2>${editing ? "Edit invoice #" + editing.num : "New invoice"}</h2>
  <div class="card">
    <div class="grid2">
      <div><label>Customer</label>
        <input id="cname" list="cust" placeholder="type or pick">
        <datalist id="cust">${customers.map((c) =>
          `<option value="${esc(c.display_name || c.name)}">`).join("")}</datalist></div>
      <div><label>Currency</label><input id="cur" value="${esc(cur)}"></div>
      <div><label>Issue date</label><input id="idate" type="date" value="${today}"></div>
      <div><label>Payment terms</label>
        <input id="cond" list="condl" placeholder="Net 30…">
        <datalist id="condl">${condTexts.map((t) =>
          `<option value="${esc(t)}">`).join("")}</datalist></div>
    </div>
    <label>Line items</label>
    <table class="lines" id="lines">
      <tr><th style="width:45%">Description</th><th>Qty</th><th>Unit price</th>
          <th class="right">Amount</th><th></th></tr>
    </table>
    <datalist id="iteml">${items.map((i) =>
      `<option value="${esc(i.display_name || i.name)}">`).join("")}</datalist>
    <p style="margin-top:8px"><button class="ghost" id="addline">+ line</button></p>
    <div class="grid2">
      <div><label>Tax rate %</label><input id="tax" type="number" value="0"></div>
      <div><label>Footer notes</label><input id="notes"></div>
    </div>
    <p style="margin-top:16px" class="row">
      <button id="save">${editing ? "Save changes" : "Create invoice"}</button>
      <span class="muted" id="nmsg"></span></p>
  </div>`;
  const itemByName = Object.fromEntries(
    items.map((i) => [i.display_name || i.name, i]));
  const custByName = Object.fromEntries(
    customers.map((c) => [c.display_name || c.name, c]));
  $("#cname").onchange = () => {
    const c = custByName[$("#cname").value.trim()];
    if (c && c.payment_terms) $("#cond").value = c.payment_terms;
  };
  function addLine(pre) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input class="d" list="iteml"></td>
      <td><input class="q" type="number" value="1" style="width:70px"></td>
      <td><input class="p" type="number" value="0" style="width:110px"></td>
      <td class="right amt">–</td>
      <td><a class="del">✕</a></td>`;
    $("#lines").appendChild(tr);
    const recalc = () => {
      const q = +tr.querySelector(".q").value || 0;
      const p = +tr.querySelector(".p").value || 0;
      tr.querySelector(".amt").textContent = money(q * p, $("#cur").value);
    };
    tr.querySelector(".d").onchange = () => {
      const it = itemByName[tr.querySelector(".d").value];
      if (it) {
        tr.querySelector(".p").value = it.default_price;
        tr.dataset.unit = it.unit || "pcs";
        recalc();
      }
    };
    tr.oninput = recalc;
    tr.querySelector(".del").onclick = () => tr.remove();
    if (pre && pre.description !== undefined) {
      tr.querySelector(".d").value = pre.description;
      tr.querySelector(".q").value = pre.quantity;
      tr.querySelector(".p").value = pre.unit_price;
      tr.dataset.unit = pre.unit || "pcs";
      recalc();
    }
  }
  addLine();
  $("#addline").onclick = () => addLine();
  const fillFrom = (d) => {
    $("#cname").value = d.customer_name || "";
    $("#cur").value = d.currency || cur;
    $("#tax").value = d.tax_rate || 0;
    $("#cond").value = d.payment_conditions || "";
    $("#notes").value = d.footer_notes || "";
    document.querySelectorAll("#lines tr").forEach((tr, i) => {
      if (i) tr.remove();
    });
    for (const li of d.line_items || []) addLine(li);
  };
  const DRAFT_KEY = "ifs-draft";
  const grabForm = () => ({
    customer_name: $("#cname").value, currency: $("#cur").value,
    tax_rate: +$("#tax").value || 0,
    payment_conditions: $("#cond").value, footer_notes: $("#notes").value,
    line_items: [...document.querySelectorAll("#lines tr")].slice(1)
      .map((tr) => ({ description: tr.querySelector(".d").value,
        quantity: +tr.querySelector(".q").value || 0,
        unit_price: +tr.querySelector(".p").value || 0,
        unit: tr.dataset.unit || "pcs" })) });
  if (editing) {
    fillFrom(editing);
    $("#idate").value = editing.issue_date || today;
  } else if (!startDraft) {
    // draft autosave: the form survives a closed tab, like the original
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (d && (d.customer_name || (d.line_items || [])
          .some((l) => l.description))) {
        fillFrom(d);
        toast("draft restored");
      }
    } catch { /* corrupt draft: start clean */ }
    $("#view").oninput = () => {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(grabForm())); }
      catch { /* storage full: autosave is best-effort */ }
    };
  }
  if (startDraft) {
    // Duplicate: everything carries over except identity — the number
    // is claimed fresh from the network at save, dates reset to today.
    fillFrom(startDraft);
    toast(`copied from invoice #${startDraft.num} — new number on save`);
  }

  $("#save").onclick = async () => {
    const lines = [...document.querySelectorAll("#lines tr")].slice(1)
      .map((tr) => ({
        description: tr.querySelector(".d").value.trim(),
        quantity: +tr.querySelector(".q").value || 0,
        unit_price: +tr.querySelector(".p").value || 0,
        unit: tr.dataset.unit || "pcs" }))
      .filter((l) => l.description);
    const cname = $("#cname").value.trim();
    if (!cname || !lines.length)
      return toast("a customer and at least one line are required");
    $("#save").disabled = true;
    $("#nmsg").innerHTML = editing
      ? '<span class="spin"></span> saving…'
      : '<span class="spin"></span> claiming a number on the network…';
    try {
      // Network-arbitrated: unique even if your other laptop invoices
      // at the same second. Numbers start at 10001 like the original;
      // gaps happen only on a crash after a claim — explainable, which
      // is what auditors actually require of invoice numbering.
      const num = editing ? editing.num
        : 10000 + await db.nextValue("invoice");
      const cust = customers.find(
        (c) => (c.display_name || c.name) === cname) || {};
      const subtotal = lines.reduce((s, l) => s + l.quantity * l.unit_price, 0);
      const taxRate = +$("#tax").value || 0;
      const condText = $("#cond").value.trim();
      const netM = /net\s*(\d+)/i.exec(condText);
      const dueDays = netM ? +netM[1] : 0;
      const issue = $("#idate").value || today;
      const due = new Date(Date.parse(issue) + dueDays * 86400000)
        .toISOString().slice(0, 10);
      await replace({
        kind: K.invoice, num: Math.min(num, NUM_MAX),
        day: Math.min(toDay(issue), DAY_MAX),
        name: cname.slice(0, 6).toLowerCase(),
        customer_name: cname, customer_address: cust.address || "",
        customer_city: cust.city || "",
        customer_postal_code: cust.postal_code || "",
        customer_country: cust.country || "",
        customer_tax_id: cust.tax_id || "",
        line_items: lines, subtotal, tax_rate: taxRate,
        tax_amount: subtotal * taxRate / 100,
        total: subtotal * (1 + taxRate / 100),
        currency: $("#cur").value || "USD",
        issue_date: issue, due_date: due,
        payment_conditions: condText, footer_notes: $("#notes").value,
        status: editing ? editing.status : "created",
        created_at: editing ? editing.created_at : Date.now() },
        editing || null);
      localStorage.removeItem("ifs-draft");
      if (condText && !conds.find((c) => c.text === condText))
        await replace({ kind: K.condition, text: condText, uses: 1 }, null);
      if (!customers.find((c) => (c.display_name || c.name) === cname))
        await replace({ kind: K.customer,
          name: cname.slice(0, 6).toLowerCase(), display_name: cname,
          email: "", phone: "", address: "", city: "", postal_code: "",
          country: "", tax_id: "" }, null);
      toast(editing ? `invoice #${num} updated`
        : `invoice #${num} created`);
      go("invoices");
    } catch (e) {
      toast(e.message);
      $("#save").disabled = false;
      $("#nmsg").textContent = "";
    }
  };
}

// Full-fidelity entity forms: the original's customer card has eight
// fields and an edit flow; the first Solo cut had three and none —
// the first thing its first user noticed. Update = delete + reinsert,
// the same immutable-record pattern as everywhere else.
function entityView(kindNo, title, fields, cols) {
  return async () => {
    const rows = await listKind(kindNo);
    const terms = fields.some((f) => f.termlist)
      ? [...new Set([...(await listKind(K.condition)).map((c) => c.text),
          "Due on receipt", "Net 7", "Net 15", "Net 30", "Net 45",
          "Net 60"])]
      : null;
    let editRid = null;
    $("#view").innerHTML = `
    <h2>${title}</h2>
    <div class="card">${terms ? `<datalist id="termsdl">${terms.map((t) =>
      `<option value="${esc(t)}">`).join("")}</datalist>` : ""}<div class="grid2">
      ${fields.map((f) => `<div><label>${f.label}${f.req ? " *" : ""}</label>
        <input id="f-${f.key}" ${f.type ? `type="${f.type}"` : ""}
          ${f.termlist ? 'list="termsdl"' : ""}></div>`).join("")}
    </div><p style="margin-top:12px" class="row">
      <button id="save-ent">Add</button>
      <button id="cancel-ent" class="quiet" style="display:none">Cancel</button>
    </p></div>
    <div class="card"><table>
      <tr>${cols.map((c) => `<th>${c.label}</th>`).join("")}<th></th></tr>
      ${rows.map((r) => `<tr>
        ${cols.map((c) => `<td>${esc(r[c.key] ?? "")}</td>`).join("")}
        <td class="right"><a class="edit" data-rid="${r._rid}">edit</a>
          &nbsp; <a class="del" data-rid="${r._rid}">delete</a></td>
      </tr>`).join("") ||
      `<tr><td colspan="${cols.length + 1}" class="muted">None yet.</td></tr>`}
    </table></div>`;
    const byRid = Object.fromEntries(rows.map((r) => [r._rid, r]));
    const setForm = (r) => {
      for (const f of fields)
        $(`#f-${f.key}`).value = r ? (r[f.key] ?? "") : "";
    };
    const setMode = (rid) => {
      editRid = rid;
      $("#save-ent").textContent = rid ? "Update" : "Add";
      $("#cancel-ent").style.display = rid ? "" : "none";
    };
    $("#cancel-ent").onclick = () => { setForm(null); setMode(null); };
    $("#save-ent").onclick = guard(async () => {
      const rec = { kind: kindNo };
      for (const f of fields) {
        const v = $(`#f-${f.key}`).value;
        rec[f.key] = f.type === "number" ? +v || 0 : v;
      }
      if (!rec.display_name) return toast("a name is required");
      rec.name = rec.display_name.slice(0, 6).toLowerCase();
      await replace(rec, editRid ? byRid[editRid] : null);
      go();
    });
    for (const a of document.querySelectorAll("a.edit"))
      a.onclick = () => {
        setForm(byRid[a.dataset.rid]);
        setMode(a.dataset.rid);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    for (const a of document.querySelectorAll("a.del"))
      a.onclick = guard(async () => { await db.delete(a.dataset.rid); go(); });
  };
}

    </p>
  </div>
  <div class="card">
    <h2 style="font-size:16px">Devices &amp; access</h2>
    <p class="muted">An invite carries the master key: whoever holds it
    reads and writes this ledger. Send it like a house key — to your
    other laptop, your accountant, or a Python script
    (<code>Owner.accept</code> takes the same string).</p>
    <p class="row" style="margin-top:8px">
      <button class="ghost" id="mkinv">Show invite</button></p>
    <textarea id="invout" class="invite" readonly
      style="display:none;margin-top:8px"></textarea>
  </div>`;
  $("#reckit").onclick = () => {
    const stamp = new Date().toISOString().slice(0, 10);
    download(`invoiceflow-solo-recovery-${stamp}.txt`,
`InvoiceFlow Solo — RECOVERY KIT (${stamp})
=========================================
This string IS the master key to your ledger. Anyone holding it can
read and write your books. Store it like a house key: password
manager, printed copy in a safe — never email, never cloud notes.

To recover on any device: open the app, choose a passphrase, paste
the line below into the invite box. Your records return from the
network. (Python: Owner.accept(state, passphrase, invite).)

${db.invite()}
`, "text/plain");
    toast("recovery kit downloaded — store it like a house key");
  };
  $("#expjson").onclick = guard(async () => {
    const out = { app: "invoiceflow-solo", exported_at: Date.now(),
      records: {} };
    const names = { 1: "profile", 2: "customers", 3: "items",
      4: "invoices", 5: "conditions" };
    for (const [k, nm] of Object.entries(names))
      out.records[nm] = (await listKind(+k)).map(strip);
    const stamp = new Date().toISOString().slice(0, 10);
    download(`invoiceflow-solo-export-${stamp}.json`,
      JSON.stringify(out, null, 1), "application/json");
    const n = Object.values(out.records).reduce((a, v) => a + v.length, 0);
    toast(`${n} record(s) exported — the file is UNENCRYPTED`);
  });
  $("#impjson").onclick = guard(async () => {
    const file = $("#impfile").files[0];
    if (!file) return toast("choose an export file first");
    const d = JSON.parse(await file.text());
    const recs = Object.values(d.records || {}).flat()
      .filter((r) => r && r.kind >= 1 && r.kind <= 5)
      .map((r) => { const { _rid, ...rec } = r; return rec; });
    if (!recs.length) return toast("no records found in that file");
    // Import must be safe to run twice. Lid-bearing records are
    // skipped unless the file carries a NEWER revision; records
    // without lid (written before the identity pattern) are matched
    // by content — same kind, same fields, same values means it is
    // already in the books. First import round-trip duplicated every
    // pre-pattern customer, item and term; this is the protection.
    const existing = [];
    for (const k of [1, 2, 3, 4, 5]) existing.push(...await listKind(k));
    const fp = (r) => {
      const { _rid, lid, rev, ...core } = r;
      return r.kind + "|" + JSON.stringify(
        Object.keys(core).sort().map((k2) => [k2, core[k2]]));
    };
    const haveFp = new Set(existing.map(fp));
    const haveLid = new Map(existing.filter((r) => r.lid)
      .map((r) => [r.lid, r.rev || 0]));
    const fresh = recs.filter((r) => {
      if (r.lid) {
        const cur = haveLid.get(r.lid);
        return cur === undefined || (r.rev || 0) > cur;
      }
      return !haveFp.has(fp(r));
    });
    for (let i = 0; i < fresh.length; i += 25)
      await db.insertMany(fresh.slice(i, i + 25));
    toast(`${fresh.length} imported, ${recs.length - fresh.length} ` +
      `already in the books — skipped`);
    await loadProfile();
    go();
  });
  $("#addterm").onclick = guard(async () => {
    const text = $("#newterm").value.trim();
    if (!text) return toast("type a term first");
    if (conds.find((c) => c.text.toLowerCase() === text.toLowerCase()))
      return toast("that term already exists");
    await replace({ kind: K.condition, text, uses: 0 }, null);
    toast(`"${text}" saved`);
    go();
  });
  for (const a of document.querySelectorAll("a.delterm"))
    a.onclick = guard(async () => { await db.delete(a.dataset.rid); go(); });
  $("#mkinv").onclick = () => {
    $("#invout").style.display = "block";
    $("#invout").value = db.invite();
    $("#invout").select();
  };
  $("#save").onclick = async () => {
    $("#save").disabled = true;
    try {
      const rec = { kind: K.profile, name: "co", saved_at: Date.now() };
      for (const [k] of F) rec[k] = $(`#s-${k}`).value;
      const file = $("#s-logo").files[0];
      if (file) {
        if (file.size > 300_000)
          throw new Error("logo too large (300KB max)");
        rec.logo_base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(new Error("could not read the image"));
          r.readAsDataURL(file);
        });
      } else rec.logo_base64 = (profile && profile.logo_base64) || null;
      // fresh rid, not the render-time copy: the stale copy made every
      // save after the first insert a duplicate and delete nothing
      await replace(rec, profile);
      await loadProfile();
      toast("profile saved");
      go();
    } catch (e) {
      console.error(e);
      toast("refused: " + e.message);
    } finally { $("#save").disabled = false; }
  };
}

/* ------------------------------ router ------------------------------- */
const routes = { dash: dashView, invoices: invoicesView, new: newInvoiceView,
  customers: customersView, items: itemsView, settings: settingsView };
// In-memory routing on purpose: under loader.html#<sha256> the URL hash
// IS the application's integrity address — a hash router overwrote it,
// and reloading loader.html#/customers had no app to verify.
let cur = { page: "dash", arg: null };
async function go(page, arg) {
  if (page) cur = { page, arg: arg ?? null };
  if (!db) return unlockView();
  for (const a of document.querySelectorAll("#nav a"))
    a.classList.toggle("on", a.dataset.page === cur.page);
  $("#view").oninput = null;
  $("#view").innerHTML =
    '<p class="muted"><span class="spin"></span> loading\u2026</p>';
  try {
    if (cur.page === "invoice" && cur.arg) await invoiceDetail(cur.arg);
    else await (routes[cur.page] || dashView)();
  } catch (e) {
    console.error(e);
    $("#view").innerHTML = `<div class="card"><p><b>Refused:</b>
      ${esc(e.message)}</p><p class="muted">The engine refuses rather
      than answering wrong — usually a degraded network moment.
      <a id="retry">Retry</a></p></div>`;
    $("#retry").onclick = () => go();
  }
}
for (const a of document.querySelectorAll("#nav a"))
  a.onclick = () => go(a.dataset.page);
unlockView();
</script>
</body>
</html>
